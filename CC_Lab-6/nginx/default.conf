upstream backend_servers {
    least_conn;
    server 172.18.0.2:8080;
    server 172.18.0.3:8080;
}

server {
    listen 80;

    location / {
        proxy_pass http://backend_servers;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
